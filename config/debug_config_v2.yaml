# ============================================
# Fusion-UNet Debug Configuration
# ============================================

# --- Data ---
data:
  train_dir: "data/train"
  val_dir: "data/val"
  test_dir: "data/test"
  image_size: 256
  batch_size: 2
  num_workers: 0 # Safe for Windows debug
  pin_memory: true

# --- Training ---
training:
  epochs: 1
  optimizer:
    type: "adam"
    lr: 1.0e-4
    weight_decay: 1.0e-5
    betas: [0.9, 0.999]
  scheduler:
    type: "cosine"
    T_max: 50
    eta_min: 1.0e-6
    patience: 10
    factor: 0.5
  gradient_clip: 1.0
  mixed_precision: true

# --- Loss ---
loss:
  intensity_weight_ir: 0.5
  intensity_weight_vis: 0.5
  ssim_weight: 1.0
  gradient_weight: 0.5
  ssim_window_size: 11

# --- Logging ---
logging:
  log_interval: 1
  image_interval: 1
  tensorboard_dir: "experiments/logs_debug"

# --- Checkpointing ---
checkpoint:
  save_dir: "checkpoints_debug"
  save_interval: 1
  early_stopping_patience: 20

# --- Validation ---
validation:
  metrics: ["ssim", "psnr", "entropy", "mi", "ag"]
  primary_metric: "ssim"
